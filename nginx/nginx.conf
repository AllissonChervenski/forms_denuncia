# ==============================================================================
# Configuração do Nginx para forms_denuncia em Produção
# ==============================================================================

# Definição do upstream para o serviço Django (Gunicorn)
upstream django_app {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Tamanho máximo do payload de upload (Permite fotos de denúncias até 25MB)
    client_max_body_size 25M;

    # Otimização de envio de arquivos
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compressão Gzip para economia de banda e performance no carregamento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Headers de Segurança no nível do Web Server
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Servindo Arquivos Estáticos com Cache no Navegador (30 dias)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Servindo Arquivos de Mídia (Uploads de denúncias)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Proxy Reverso para a Aplicação Django (Gunicorn)
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Headers essenciais para o Django identificar o cliente e protocolo real
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
