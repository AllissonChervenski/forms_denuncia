<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %} | Gestão CEREST</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto+Condensed:wght@300;400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Select2 CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  </head>
  <body class="font-['Roboto'] font-normal bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <!-- Navbar Responsiva do Dashboard com fonte Roboto -->
    <nav class="font-['Roboto'] bg-white border-b border-slate-200 py-4 px-4 sm:px-8 flex justify-between items-center shadow-sm">
      {% load static %}
      <a href="{% if request.user.is_authenticated %}{% url 'dashboard:index' %}{% else %}/{% endif %}" class="flex items-center gap-3">
        <img src="{% static 'core/cerest.png' %}" alt="Logo CEREST" class="h-10 sm:h-12 w-auto object-contain">
      </a>
      
      <div class="flex items-center gap-4">
        {% if request.user.is_authenticated %}
          <div class="hidden sm:flex items-center gap-2 text-xs sm:text-sm font-medium text-slate-600">
            <span>Olá, <strong>{{ request.user.username }}</strong></span>
          </div>
          <form method="post" action="{% url 'dashboard:logout' %}" class="m-0">
            {% csrf_token %}
            <button class="py-2 px-5 text-sm font-bold text-slate-900 hover:bg-emerald-400 bg-[#77EB83] rounded-lg transition shadow-sm" type="submit">
              Sair
            </button>
          </form>
        {% endif %}
      </div>
    </nav>

    <!-- Cabeçalho -->
    <header class="font-['Roboto'] max-w-6xl mx-auto mt-6 mb-4 px-4 text-center">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">
        {% block header_text %}
          {{ header_text }}
        {% endblock %}
      </h1>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 w-full flex-grow mb-12">
      {% block content %}
      {% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="py-6 px-6 sm:px-12 bg-[#77EB83] text-slate-900 mt-auto text-center text-xs sm:text-sm font-medium">
      <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
        <span>CEREST - Painel Administrativo de Gestão de Denúncias</span>
        <div class="flex gap-4">
          <a href="/" class="hover:underline">Portal Público</a>
          <a href="/admin/" class="hover:underline">Painel Django</a>
        </div>
      </div>
    </footer>
  </body>
</html>
