<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano de Testes de Software (IEEE 829) - Forms Denúncia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Marked.js para renderização Markdown completa e GitHub Markdown CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      padding: 2rem 1rem;
    }
    .wrapper {
      max-width: 960px;
      margin: 0 auto;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #334155;
    }
    .back-link {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .markdown-body {
      background-color: #1e293b !important;
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid #334155;
      color: #f8fafc !important;
    }
    .markdown-body table {
      display: table;
      width: 100%;
    }
    .markdown-body pre, .markdown-body code {
      background-color: #0f172a !important;
      border: 1px solid #334155;
      color: #38bdf8 !important;
      font-family: 'JetBrains Mono', monospace;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: #94a3b8;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-nav">
      <a href="index.html" class="back-link">&larr; Voltar ao Portal de Documentação</a>
      <a href="coverage/index.html" class="back-link">Ver Relatório de Cobertura (Coverage) &rarr;</a>
    </div>

    <div id="content" class="markdown-body">
      <div class="loading">Carregando e renderizando o Plano de Testes IEEE 829...</div>
    </div>
  </div>

  <script>
    fetch('plano_de_testes_ieee829.md')
      .then(response => {
        if (!response.ok) throw new Error('Não foi possível carregar o arquivo markdown.');
        return response.text();
      })
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<div style="color: #ef4444; padding: 2rem;"><h3>Erro ao carregar o documento</h3><p>' + err.message + '</p></div>';
      });
  </script>
</body>
</html>
